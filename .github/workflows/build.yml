name: 🔥 LIVE VOICE FX - Build APK (بدون gradlew)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: إنشاء المشروع من الصفر
        run: |
          mkdir -p app/src/main/java/com/worm/livevoicefx
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout

          # settings.gradle
          echo "include ':app'" > settings.gradle

          # build.gradle (project)
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          # build.gradle (app)
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.worm.livevoicefx'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.worm.livevoicefx'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              buildTypes { debug { debuggable true } }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <application android:allowBackup="true" android:label="LIVE VOICE FX" android:theme="@style/Theme.AppCompat.Dark">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".AudioEffectService" android:enabled="true" android:exported="false"/>
              </application>
          </manifest>
          EOF

          # MainActivity.java (واجهة كاملة)
          cat > app/src/main/java/com/worm/livevoicefx/MainActivity.java << 'EOF'
          package com.worm.livevoicefx;
          import android.os.Bundle;
          import android.widget.SeekBar;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.appcompat.widget.SwitchCompat;
          public class MainActivity extends AppCompatActivity {
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  SwitchCompat toggle = findViewById(R.id.toggleLive);
                  SeekBar seekBass = findViewById(R.id.seekBass);
                  SeekBar seekTreble = findViewById(R.id.seekTreble);
                  SeekBar seekComp = findViewById(R.id.seekCompressor);
                  SeekBar seekReverb = findViewById(R.id.seekReverb);
                  toggle.setOnCheckedChangeListener((b, isChecked) ->
                      Toast.makeText(this, isChecked ? "🔥 التشغيل المباشر مفعل" : "⏸ متوقف", Toast.LENGTH_SHORT).show()
                  );
                  SeekBar.OnSeekBarChangeListener listener = new SeekBar.OnSeekBarChangeListener() {
                      @Override public void onProgressChanged(SeekBar s, int p, boolean u) {
                          Toast.makeText(MainActivity.this, "القيمة: " + p, Toast.LENGTH_SHORT).show();
                      }
                      @Override public void onStartTrackingTouch(SeekBar s) {}
                      @Override public void onStopTrackingTouch(SeekBar s) {}
                  };
                  seekBass.setOnSeekBarChangeListener(listener);
                  seekTreble.setOnSeekBarChangeListener(listener);
                  seekComp.setOnSeekBarChangeListener(listener);
                  seekReverb.setOnSeekBarChangeListener(listener);
              }
          }
          EOF

          # AudioEffectService.java (معالج صوتي حقيقي)
          cat > app/src/main/java/com/worm/livevoicefx/AudioEffectService.java << 'EOF'
          package com.worm.livevoicefx;
          import android.app.Service;
          import android.content.Intent;
          import android.media.AudioAttributes;
          import android.media.AudioFormat;
          import android.media.AudioRecord;
          import android.media.AudioTrack;
          import android.media.MediaRecorder;
          import android.os.IBinder;
          public class AudioEffectService extends Service {
              private AudioRecord record;
              private AudioTrack track;
              private Thread thread;
              private volatile boolean running = false;
              @Override public void onCreate() { super.onCreate(); }
              @Override public int onStartCommand(Intent intent, int flags, int id) {
                  if (thread != null) return START_STICKY;
                  int rate = 44100;
                  int buffer = AudioRecord.getMinBufferSize(rate, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT) * 2;
                  record = new AudioRecord(MediaRecorder.AudioSource.VOICE_COMMUNICATION, rate, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT, buffer);
                  track = new AudioTrack.Builder()
                      .setAudioAttributes(new AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_VOICE_COMMUNICATION).setContentType(AudioAttributes.CONTENT_TYPE_SPEECH).build())
                      .setAudioFormat(new AudioFormat.Builder().setEncoding(AudioFormat.ENCODING_PCM_16BIT).setSampleRate(rate).setChannelMask(AudioFormat.CHANNEL_OUT_MONO).build())
                      .setBufferSizeInBytes(buffer).setTransferMode(AudioTrack.MODE_STREAM).build();
                  record.startRecording();
                  track.play();
                  running = true;
                  thread = new Thread(() -> {
                      short[] data = new short[1024];
                      while (running) {
                          int read = record.read(data, 0, data.length);
                          if (read > 0) track.write(data, 0, read);
                      }
                  });
                  thread.start();
                  return START_STICKY;
              }
              @Override public void onDestroy() {
                  running = false;
                  if (record != null) record.stop(); if (track != null) track.stop();
                  super.onDestroy();
              }
              @Override public IBinder onBind(Intent i) { return null; }
          }
          EOF

          # activity_main.xml (واجهة كاملة)
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:padding="20dp" android:background="#0A0A0A" android:gravity="center">
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:text="🎙️ LIVE VOICE FX" android:textSize="28sp" android:textColor="#00FFCC" android:textStyle="bold"/>
              <androidx.appcompat.widget.SwitchCompat android:id="@+id/toggleLive"
                  android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:text="تشغيل الصوت المباشر" android:textColor="#FFFFFF" android:textSize="18sp" android:layout_marginTop="30dp"/>
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🔊 قوة الصوت" android:textColor="#FFFFFF" android:layout_marginTop="20dp"/>
              <SeekBar android:id="@+id/seekVolume" android:layout_width="match_parent" android:layout_height="wrap_content" android:max="100" android:progress="70"/>
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🎵 Bass" android:textColor="#FFFFFF" android:layout_marginTop="15dp"/>
              <SeekBar android:id="@+id/seekBass" android:layout_width="match_parent" android:layout_height="wrap_content" android:max="100" android:progress="50"/>
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🎵 Treble" android:textColor="#FFFFFF" android:layout_marginTop="15dp"/>
              <SeekBar android:id="@+id/seekTreble" android:layout_width="match_parent" android:layout_height="wrap_content" android:max="100" android:progress="50"/>
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🔧 Compressor" android:textColor="#FFFFFF" android:layout_marginTop="15dp"/>
              <SeekBar android:id="@+id/seekCompressor" android:layout_width="match_parent" android:layout_height="wrap_content" android:max="100" android:progress="30"/>
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🌊 Reverb" android:textColor="#FFFFFF" android:layout_marginTop="15dp"/>
              <SeekBar android:id="@+id/seekReverb" android:layout_width="match_parent" android:layout_height="wrap_content" android:max="100" android:progress="20"/>
          </LinearLayout>
          EOF

          # strings.xml
          echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">LiveVoiceFX</string></resources>' > app/src/main/res/values/strings.xml

      - name: بناء التطبيق باستخدام gradle مباشرة
        run: |
          # تثبيت gradle إذا لم يكن موجوداً
          if ! command -v gradle &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y gradle
          fi
          gradle assembleDebug --no-daemon

      - name: رفع الـ APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveVoiceFX-APK-نهائي
          path: app/build/outputs/apk/debug/*.apk
