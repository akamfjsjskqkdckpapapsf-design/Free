name: Build APK from Scratch (Magic Mode)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Create Full Android Project Structure
      run: |
        # 1. إنشاء هيكل المشروع
        mkdir -p app/src/main/java/com/worm/livevoicefx
        mkdir -p app/src/main/res/values
        mkdir -p gradle/wrapper

        # 2. كتابة settings.gradle
        echo "include ':app'" > settings.gradle

        # 3. كتابة build.gradle (المشروع)
        cat > build.gradle << 'EOF'
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.0.0' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        # 4. كتابة build.gradle (التطبيق)
        cat > app/build.gradle << 'EOF'
        plugins { id 'com.android.application' }
        android {
            namespace 'com.worm.livevoicefx'
            compileSdk 34
            defaultConfig {
                applicationId 'com.worm.livevoicefx'
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName '1.0'
            }
            buildTypes { debug { debuggable true } }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        # 5. كتابة AndroidManifest.xml
        cat > app/src/main/AndroidManifest.xml << 'EOF'
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.RECORD_AUDIO"/>
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
            <application android:allowBackup="true" android:label="LIVE VOICE FX">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 6. كتابة MainActivity بسيطة (لضمان البناء)
        cat > app/src/main/java/com/worm/livevoicefx/MainActivity.java << 'EOF'
        package com.worm.livevoicefx;
        import android.os.Bundle;
        import androidx.appcompat.app.AppCompatActivity;
        public class MainActivity extends AppCompatActivity {
            @Override protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(android.R.layout.activity_list_item);
            }
        }
        EOF

        # 7. إنشاء ملف resources
        echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">LiveVoice</string></resources>' > app/src/main/res/values/strings.xml

        # 8. تحميل gradle-wrapper.jar وكتابة gradlew
        curl -L https://github.com/gradle/gradle/raw/v8.2.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF

        echo '#!/bin/sh' > gradlew
        echo 'exec java -cp "$(dirname "$0")/gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"' >> gradlew
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: LiveVoiceFX-Magic-APK
        path: app/build/outputs/apk/debug/*.apk
